name: Publish Buda Release

on:
  workflow_dispatch:
  push:
    tags: ['buda/v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod, cache: true }
      - name: Install repository tooling
        env:
          GOBIN: ${{ github.workspace }}/.bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/CGuiho/mirror@v4.0.1
          go install github.com/CGuiho/runx@v0.12.1
          go install github.com/CGuiho/xdocs@v0.10.0
      - name: Resolve and validate canonical version
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#buda/v}"
          [[ "$GITHUB_REF_NAME" == buda/v* ]] || { echo 'non-canonical tag' >&2; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || { echo 'invalid SemVer' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - name: Required quality and tooling gates
        run: |
          ./.bin/mirror config check
          ./.bin/runx check --format json
          ./.bin/xdocs meta . --documents --strict
          ./.bin/xdocs doctor . --warnings-as-errors
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -count=1 ./...
          go vet ./...
      - name: Build complete release unit
        run: |
          go run ./devops/build-binaries.go --version '${{ steps.release.outputs.version }}' --commit "$GITHUB_SHA" --build-date '${{ steps.release.outputs.date }}'
          (cd dist && sha256sum --check checksums.txt)
          test "$(dist/buda-linux-amd64 --version)" = '${{ steps.release.outputs.version }}'
      - name: Create or repair GitHub Release from manifest-derived assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t assets < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          paths=(); for asset in "${assets[@]}"; do paths+=("dist/$asset"); done
          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v h="## [${{ steps.release.outputs.version }}]" 'index($0,h)==1{found=1;next} found&&/^## /{exit} found{print} END{if(!found)exit 1}' CHANGELOG.md > "$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${paths[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "${paths[@]}" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes"
          fi
      - name: Verify public asset set and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          find dist -maxdepth 1 -type f -printf '%f\n' | sort > "${RUNNER_TEMP}/expected"
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort > "${RUNNER_TEMP}/actual"
          cmp "${RUNNER_TEMP}/expected" "${RUNNER_TEMP}/actual"

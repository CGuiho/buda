name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod, cache: true }
      - name: Install repository tooling
        env:
          GOBIN: ${{ github.workspace }}/.bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/CGuiho/mirror@v4.0.1
          go install github.com/CGuiho/runx@v0.12.1
          go install github.com/CGuiho/xdocs@v0.10.0
      - name: Mirror configuration
        run: ./.bin/mirror config check
      - name: RunX catalog
        run: |
          ./.bin/runx check --format json
          ./.bin/runx list --format json
      - name: Strict XDocs
        run: |
          ./.bin/xdocs meta . --documents --strict
          ./.bin/xdocs tree
          ./.bin/xdocs doctor . --warnings-as-errors
      - name: Formatting and module graph
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Go tests and vet
        run: |
          go test -count=1 ./...
          go vet ./...
      - name: Build manifest-derived release unit
        run: |
          go run ./devops/build-binaries.go --version 0.2.0-ci --commit "$GITHUB_SHA" --build-date "$(git show -s --format=%cI HEAD)"
          test -f dist/artifacts.json
          (cd dist && sha256sum --check checksums.txt)
          test "$(dist/buda-linux-amd64 --version)" = '0.2.0-ci'
          dist/buda-linux-amd64 --help-tree --help-tree-depth 2 | grep -F 'COMMAND TREE'
      - name: Installer and uninstaller syntax
        run: |
          sh -n devops/install.sh
          sh -n devops/uninstall.sh
      - uses: actions/upload-artifact@v4
        with:
          name: buda-release-unit
          path: dist/*
          if-no-files-found: error

  native-smoke:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: buda-linux-amd64
          - runner: ubuntu-24.04-arm
            asset: buda-linux-arm64
          - runner: macos-15-intel
            asset: buda-darwin-amd64
          - runner: macos-15
            asset: buda-darwin-arm64
          - runner: windows-latest
            asset: buda-windows-amd64.exe
          - runner: windows-11-arm
            asset: buda-windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: buda-release-unit, path: dist }
      - name: Unix native launcher/payload smoke
        if: runner.os != 'Windows'
        run: |
          chmod +x "dist/${{ matrix.asset }}"
          test "$("dist/${{ matrix.asset }}" --version)" = '0.2.0-ci'
      - name: Windows native payload smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $value = (& (Join-Path $PWD 'dist\${{ matrix.asset }}') --version | Out-String).Trim()
          if ($value -ne '0.2.0-ci') { throw "Unexpected raw version: $value" }

  windows-script-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell installer and uninstaller syntax
        shell: pwsh
        run: |
          $errors = @()
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'devops/install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'devops/uninstall.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

  build-only-foreign-targets:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - name: Foreign build-only targets
        run: |
          GOOS=linux GOARCH=arm GOARM=6 CGO_ENABLED=0 go build ./...
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build ./...

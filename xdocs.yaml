schema: 1
extensions:
  supported:
    - .xdocs.md
ai:
  mode: auto
scan:
  exclude:
    - .git
    - .buda
    - .cache
    - .qmd
    - dist
    - build
    - vendor
ignore:
  gitignore: true
  rules:
    - pattern: "**/AGENTS.md"
      kind: file
      frontmatter: false
    - pattern: "**/README.md"
      kind: file
      frontmatter: false
    - pattern: "**/CLAUDE.md"
      kind: file
      frontmatter: false
    - pattern: skills/guiho-s-buda/SKILL.md
      kind: file
      frontmatter: false
project:
  name: buda
